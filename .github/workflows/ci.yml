name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.1.32
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun x tsc -p tsconfig.json --noEmit
      - name: Run tests
        run: bun test
